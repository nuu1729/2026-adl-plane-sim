<script>
/* =====================================================================
 *  AeroLab 物理エンジン（描画に一切依存しない純粋な計算モジュール）
 *  ---------------------------------------------------------------------
 *  座標の約束（翼断面）: 前縁 x=0, 後縁 x=1（翼弦長 c=1 で無次元化）,
 *                       y は上向き。一様流は (cosα, sinα)（左→右）。
 *  3 次元の機体座標  : x = 機尾方向, y = 上, z = スパン方向。
 *                       原点は翼根の 1/4 翼弦点（ほぼ重心）。
 *  すべて SI 単位（m, s, kg, N, rad）。
 * ===================================================================== */
(function (global) {
  'use strict';

  const DEG = Math.PI / 180;
  const G0 = 9.80665;                       // 重力加速度 [m/s²]
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  /* ------------------------------------------------------------------
   * 0. 小さな線形代数（部分ピボット付き LU 分解）
   * ------------------------------------------------------------------ */
  function luFactor(rows) {
    const n = rows.length, A = rows, piv = new Int32Array(n);
    for (let i = 0; i < n; i++) piv[i] = i;
    for (let k = 0; k < n; k++) {
      let p = k, max = Math.abs(A[k][k]);
      for (let i = k + 1; i < n; i++) { const v = Math.abs(A[i][k]); if (v > max) { max = v; p = i; } }
      if (max < 1e-300) throw new Error('行列が特異です');
      if (p !== k) { const t = A[p]; A[p] = A[k]; A[k] = t; const tp = piv[p]; piv[p] = piv[k]; piv[k] = tp; }
      const rk = A[k], akk = rk[k];
      for (let i = k + 1; i < n; i++) {
        const ri = A[i], f = ri[k] / akk;
        ri[k] = f;
        if (f !== 0) for (let j = k + 1; j < n; j++) ri[j] -= f * rk[j];
      }
    }
    return { LU: A, piv };
  }
  function luSolve(F, b) {
    const { LU, piv } = F, n = LU.length, x = new Float64Array(n);
    for (let i = 0; i < n; i++) x[i] = b[piv[i]];
    for (let i = 0; i < n; i++) { const r = LU[i]; let s = x[i]; for (let j = 0; j < i; j++) s -= r[j] * x[j]; x[i] = s; }
    for (let i = n - 1; i >= 0; i--) { const r = LU[i]; let s = x[i]; for (let j = i + 1; j < n; j++) s -= r[j] * x[j]; x[i] = s / r[i]; }
    return x;
  }
  const solveDense = (M, b) => luSolve(luFactor(M.map((r) => Float64Array.from(r))), b);

  /* ------------------------------------------------------------------
   * 1. 国際標準大気 (ISA)：高度 → 温度・圧力・密度・粘性係数
   * ------------------------------------------------------------------ */
  const Atmosphere = {
    R: 287.053,
    at(h) {
      h = clamp(h, -500, 20000);
      let T, p;
      if (h <= 11000) { T = 288.15 - 0.0065 * h; p = 101325 * Math.pow(T / 288.15, 5.255877); }
      else { T = 216.65; p = 22632.06 * Math.exp(-G0 * (h - 11000) / (287.053 * 216.65)); }
      const rho = p / (287.053 * T);
      const mu = 1.458e-6 * Math.pow(T, 1.5) / (T + 110.4);   // サザーランドの式
      return { h, T, p, rho, mu };
    },
  };

  /* ------------------------------------------------------------------
   * 2. NACA 4 桁翼型の生成
   *    例 "2412": 最大キャンバー 2%、その位置 40%、最大厚さ 12%
   *    節点は「後縁(下面) → 前縁 → 後縁(上面)」の時計回り。
   *    x は余弦間隔（前縁・後縁付近を細かく）。後縁は閉じた形（係数 −0.1036）。
   * ------------------------------------------------------------------ */
  class NacaAirfoil {
    static parse(code) {
      const s = String(code).trim();
      if (!/^\d{4}$/.test(s)) return null;
      const m = +s[0] / 100, p = +s[1] / 10, t = +s.slice(2) / 100;
      if (t < 0.01 || t > 0.3) return null;
      if (m > 0 && p === 0) return null;
      return { code: s, m, p, t };
    }
    constructor(code, nPanels = 150) {
      const prm = NacaAirfoil.parse(code);
      if (!prm) throw new Error('NACA 4桁の番号が不正です: ' + code);
      Object.assign(this, prm);
      if (nPanels % 2) nPanels++;
      const nh = nPanels / 2, N1 = nPanels + 1;
      this.nPanels = nPanels; this.leIndex = nh;
      this.x = new Float64Array(N1); this.y = new Float64Array(N1);
      this.isUpper = new Uint8Array(N1);
      const st = [];
      for (let k = 0; k <= nh; k++) {
        const xc = 0.5 * (1 - Math.cos(Math.PI * k / nh));
        const yt = this.thickness(xc), { yc, dyc } = this.camber(xc), th = Math.atan(dyc);
        st.push({ xu: xc - yt * Math.sin(th), yu: yc + yt * Math.cos(th), xl: xc + yt * Math.sin(th), yl: yc - yt * Math.cos(th) });
      }
      let i = 0;
      for (let k = nh; k >= 0; k--) { this.x[i] = st[k].xl; this.y[i] = st[k].yl; i++; }
      for (let k = 1; k <= nh; k++) { this.x[i] = st[k].xu; this.y[i] = st[k].yu; this.isUpper[i] = 1; i++; }
    }
    /** 厚さ分布 y_t(x)（片側） */
    thickness(x) {
      const t = this.t;
      return 5 * t * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x * x + 0.2843 * x * x * x - 0.1036 * x * x * x * x);
    }
    /** キャンバーライン y_c(x) とその傾き */
    camber(x) {
      const { m, p } = this;
      if (m === 0 || p === 0) return { yc: 0, dyc: 0 };
      if (x < p) return { yc: m / (p * p) * (2 * p * x - x * x), dyc: 2 * m / (p * p) * (p - x) };
      const q = 1 - p;
      return { yc: m / (q * q) * ((1 - 2 * p) + 2 * p * x - x * x), dyc: 2 * m / (q * q) * (p - x) };
    }
    /** 上面・下面の近似高さ（y_c ± y_t）。粒子の衝突判定用 */
    upperY(x) { return this.camber(x).yc + this.thickness(x); }
    lowerY(x) { return this.camber(x).yc - this.thickness(x); }
  }

  /* ------------------------------------------------------------------
   * 3. 線形渦パネル法
   *    翼面を N 枚の直線パネルに分け、各パネル上で渦度 γ(s) が線形に変化する
   *    渦シートを置く。未知数は N+1 個の節点強さ γ_j。
   *      ・N 個の条件：各パネル中点で「流れが翼面を貫かない」（法線速度 0）
   *      ・1 個の条件：クッタ条件 γ_0 + γ_N = 0（後縁で流れが滑らかに離れる）
   *    ここで γ は反時計回りを正とする。揚力を生む循環（時計回り）は Γ = −∮γ ds。
   * ------------------------------------------------------------------ */

  /** 局所座標（パネル始点が原点・パネル方向が x 軸・外向き法線が y 軸）での
   *  長さ L の線形渦パネルの誘導速度。γ_a（始点）, γ_b（終点）の係数を返す。
   *  点渦（反時計回り Γ）: u = −Γy/(2πr²), v = Γ(x−s)/(2πr²) を s で積分した解析式。 */
  function linearVortexInfluence(x, y, L, selfPanel, out) {
    let dth, lnr;
    if (selfPanel) { dth = Math.PI; lnr = 0; }       // パネル自身の中点（外側 y→+0 の極限）
    else {
      dth = Math.atan2(y, x - L) - Math.atan2(y, x);
      const r1s = Math.max(x * x + y * y, 1e-24), r2s = Math.max((x - L) * (x - L) + y * y, 1e-24);
      lnr = 0.5 * Math.log(r1s / r2s);
    }
    const Iy0 = dth, Iy1 = x * dth - y * lnr, Ix0 = lnr, Ix1 = x * lnr - L + y * dth;
    const k = 1 / (2 * Math.PI);
    out[0] = -k * (Iy0 - Iy1 / L);   // u の γ_a 係数
    out[1] = k * (Ix0 - Ix1 / L);    // v の γ_a 係数
    out[2] = -k * (Iy1 / L);         // u の γ_b 係数
    out[3] = k * (Ix1 / L);          // v の γ_b 係数
  }

  class VortexPanelSolver {
    constructor(foil) {
      this.foil = foil;
      const X = foil.x, Y = foil.y, N = X.length - 1;
      this.N = N;
      const S = new Float64Array(N), ct = new Float64Array(N), st = new Float64Array(N);
      const xm = new Float64Array(N), ym = new Float64Array(N);
      for (let j = 0; j < N; j++) {
        const dx = X[j + 1] - X[j], dy = Y[j + 1] - Y[j];
        S[j] = Math.hypot(dx, dy); ct[j] = dx / S[j]; st[j] = dy / S[j];
        xm[j] = 0.5 * (X[j] + X[j + 1]); ym[j] = 0.5 * (Y[j] + Y[j + 1]);
      }
      Object.assign(this, { S, ct, st, xm, ym });

      // --- 影響係数行列：An = 法線方向, At = 接線方向 ---
      const An = [], At = [], inf = new Float64Array(4);
      for (let i = 0; i < N; i++) {
        const an = new Float64Array(N + 1), at = new Float64Array(N + 1);
        const nx = -st[i], ny = ct[i], tx = ct[i], ty = st[i];
        for (let j = 0; j < N; j++) {
          const self = i === j;
          const dx = xm[i] - X[j], dy = ym[i] - Y[j];
          const x = self ? 0.5 * S[j] : dx * ct[j] + dy * st[j];
          const y = self ? 0 : -dx * st[j] + dy * ct[j];
          linearVortexInfluence(x, y, S[j], self, inf);
          const wax = inf[0] * ct[j] - inf[1] * st[j], way = inf[0] * st[j] + inf[1] * ct[j];
          const wbx = inf[2] * ct[j] - inf[3] * st[j], wby = inf[2] * st[j] + inf[3] * ct[j];
          an[j] += wax * nx + way * ny; an[j + 1] += wbx * nx + wby * ny;
          at[j] += wax * tx + way * ty; at[j + 1] += wbx * tx + wby * ty;
        }
        An.push(an); At.push(at);
      }
      this.At = At;

      // 節点の重み（循環 = Σ w_j γ_j）
      const w = new Float64Array(N + 1);
      for (let j = 0; j < N; j++) { w[j] += 0.5 * S[j]; w[j + 1] += 0.5 * S[j]; }
      this.w = w;

      // --- 系1：接線条件 + クッタ条件（α=0°, 90° の 2 つの右辺） ---
      const M1 = An.map((r) => Float64Array.from(r));
      const kutta = new Float64Array(N + 1); kutta[0] = 1; kutta[N] = 1;
      M1.push(kutta);
      const F1 = luFactor(M1);
      const rhs0 = new Float64Array(N + 1), rhs90 = new Float64Array(N + 1);
      for (let i = 0; i < N; i++) { rhs0[i] = st[i]; rhs90[i] = -ct[i]; }   // −V∞·n
      this.g0 = luSolve(F1, rhs0);
      this.g90 = luSolve(F1, rhs90);

      // --- 系2：一様流なし・循環 Γ=1 の解（失速時に循環を減らす可視化用の基底） ---
      const M2 = An.map((r) => Float64Array.from(r));
      M2.push(Float64Array.from(w, (v) => -v));
      const rhsG = new Float64Array(N + 1); rhsG[N] = 1;
      this.gG = luSolve(luFactor(M2), rhsG);

      // --- 各基底の翼面接線速度（パネル中点・外側） ---
      const vt = (g, fx, fy) => {
        const out = new Float64Array(N);
        for (let i = 0; i < N; i++) {
          let s = fx * ct[i] + fy * st[i];
          const a = At[i];
          for (let j = 0; j <= N; j++) s += a[j] * g[j];
          out[i] = s;
        }
        return out;
      };
      this.vt0 = vt(this.g0, 1, 0);
      this.vt90 = vt(this.g90, 0, 1);
      this.vtG = vt(this.gG, 0, 0);

      // クッタ・ジューコフスキー： Cl = 2Γ/(V∞c)。Cl(α) = Cl0·cosα + Cl90·sinα（厳密に重ね合わせ）
      this.Cl0 = 2 * this.circulation(this.g0);
      this.Cl90 = 2 * this.circulation(this.g90);
      this._gbuf = new Float64Array(N + 1);
      this._gKey = NaN;
    }
    circulation(g) { let s = 0; for (let j = 0; j <= this.N; j++) s += this.w[j] * g[j]; return -s; }
    /** 非粘性の揚力係数（パネル法そのもの） */
    clInviscid(a) { return this.Cl0 * Math.cos(a) + this.Cl90 * Math.sin(a); }
    /** 迎角 a と循環補正 dG に対する節点渦強さ γ_j（翼面の流速 = |γ_j|） */
    gamma(a, dG = 0, out = new Float64Array(this.N + 1)) {
      const c = Math.cos(a), s = Math.sin(a);
      for (let j = 0; j <= this.N; j++) out[j] = c * this.g0[j] + s * this.g90[j] + dG * this.gG[j];
      return out;
    }
    /** パネル中点の圧力係数 Cp = 1 − (V/V∞)²（ベルヌーイの定理） */
    surfaceCp(a, out = new Float64Array(this.N)) {
      const c = Math.cos(a), s = Math.sin(a);
      for (let i = 0; i < this.N; i++) { const v = c * this.vt0[i] + s * this.vt90[i]; out[i] = 1 - v * v; }
      return out;
    }
    /** 圧力積分による力とモーメント（揚力の検算用） */
    pressureForces(a) {
      const cp = this.surfaceCp(a);
      let fx = 0, fy = 0, mz = 0;
      for (let i = 0; i < this.N; i++) {
        const nx = -this.st[i], ny = this.ct[i];
        const px = -cp[i] * nx * this.S[i], py = -cp[i] * ny * this.S[i];
        fx += px; fy += py;
        mz += (this.xm[i] - 0.25) * py - this.ym[i] * px;
      }
      return {
        cl: -fx * Math.sin(a) + fy * Math.cos(a),
        cd: fx * Math.cos(a) + fy * Math.sin(a),   // ポテンシャル流では 0（ダランベールのパラドックス）
        cm: -mz,                                   // 1/4 翼弦まわり（頭上げ正）
      };
    }
    /** 翼まわりの任意点の速度（一様流込み, V∞=1）。煙パルスの厳密な追跡に使う */
    velocityAt(px, py, g, a, out) {
      const X = this.foil.x, Y = this.foil.y, N = this.N, inf = this._inf || (this._inf = new Float64Array(4));
      let u = Math.cos(a), v = Math.sin(a);
      for (let j = 0; j < N; j++) {
        const dx = px - X[j], dy = py - Y[j], c = this.ct[j], s = this.st[j];
        linearVortexInfluence(dx * c + dy * s, -dx * s + dy * c, this.S[j], false, inf);
        const ul = inf[0] * g[j] + inf[2] * g[j + 1], vl = inf[1] * g[j] + inf[3] * g[j + 1];
        u += ul * c - vl * s; v += ul * s + vl * c;
      }
      out[0] = u; out[1] = v;
      return out;
    }
    /** よどみ点（前縁付近で γ の符号が変わる位置） */
    stagnationPoint(g) {
      const X = this.foil.x, Y = this.foil.y, le = this.foil.leIndex, N = this.N;
      for (let d = 0; d < N / 2 - 2; d++) {
        for (const j of [le + d, le - d - 1]) {
          if (j < 1 || j >= N - 1) continue;
          if (g[j] * g[j + 1] <= 0) {
            const t = g[j] / (g[j] - g[j + 1] || 1e-30);
            return { x: X[j] + t * (X[j + 1] - X[j]), y: Y[j] + t * (Y[j + 1] - Y[j]), j };
          }
        }
      }
      return { x: X[le], y: Y[le], j: le };
    }
  }

  /* ------------------------------------------------------------------
   * 4. 断面（2次元翼）の空力モデル —— 失速を含む経験モデル
   *    付着流の Cl はパネル法（非粘性）の値。
   *    失速は Kirchhoff/Beddoes–Leishman の「はく離点モデル」で表す：
   *       f(α) = 上面のはく離位置 x/c（1 = 全面付着, 0 = 前縁ではく離）
   *       Cl = Cl_付着 × ((1+√f)/2)²
   *    α > 20° では平板の実験式へ滑らかに移行。抗力は
   *       Cd = 摩擦（Re 依存）×形状係数 + k(Cl − Cl_dmin)² + はく離による圧力抗力
   * ------------------------------------------------------------------ */
  class SectionModel {
    constructor(panel) {
      this.panel = panel; this.foil = panel.foil;
      this.Cl0 = panel.Cl0; this.Cl90 = panel.Cl90;
      this.K = Math.hypot(this.Cl0, this.Cl90);
      this.alpha0 = -Math.atan2(this.Cl0, this.Cl90);        // 零揚力角
      this.a1 = 14 * DEG;                                       // 失速開始角（約14°）
      this.S1 = 1.5 * DEG; this.S2 = 3.0 * DEG;                 // はく離の進み方
      this.kProfile = 0.0055;
      this.ClDmin = this.clAtt(0);
      const t = this.foil.t;
      this.FF = 1 + 2 * t + 100 * t * t * t * t;               // 形状係数（Raymer）
      // 失速による揚力の減少分 ΔCl = Cl − Cl_付着 を表にしておく（揚力線理論の反復で何万回も呼ぶため）
      this.tMin = -45 * DEG; this.tStep = 0.05 * DEG;
      const n = Math.round((90 * DEG) / this.tStep) + 1;
      this.tn = n;
      this.tDs = new Float64Array(n); this.tDds = new Float64Array(n);
      this.tCdSep = new Float64Array(n); this.tF = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const a = this.tMin + i * this.tStep, r = this.evalRaw(a);
        this.tDs[i] = r.cl - r.clAtt; this.tCdSep[i] = r.cdSep; this.tF[i] = r.f;
      }
      for (let i = 0; i < n; i++) {
        const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
        this.tDds[i] = (this.tDs[i1] - this.tDs[i0]) / ((i1 - i0) * this.tStep);
      }
      this._lk = { cl: 0, dcl: 0, cdv: 0, f: 1 };
    }
    /** 付着流部分（パネル法）とその傾き */
    att(a, o) { const c = Math.cos(a), s = Math.sin(a); o.cl = this.Cl0 * c + this.Cl90 * s; o.dcl = -this.Cl0 * s + this.Cl90 * c; return o; }
    /** 失速部分（表の線形補間）：ΔCl, dΔCl/dα, はく離点 f, はく離抗力 */
    stall(a, o) {
      let u = clamp((a - this.tMin) / this.tStep, 0, this.tn - 1.000001);
      const i = u | 0, t = u - i;
      o.ds = this.tDs[i] + t * (this.tDs[i + 1] - this.tDs[i]);
      o.dds = this.tDds[i] + t * (this.tDds[i + 1] - this.tDds[i]);
      o.f = this.tF[i] + t * (this.tF[i + 1] - this.tF[i]);
      o.cdSep = this.tCdSep[i] + t * (this.tCdSep[i + 1] - this.tCdSep[i]);
      return o;
    }
    clAtt(a) { return this.Cl0 * Math.cos(a) + this.Cl90 * Math.sin(a); }
    /** はく離点 f(α)（Kirchhoff モデル, 正負対称） */
    sepF(a) {
      const x = Math.abs(a), a1 = this.a1;
      if (x <= a1) return 1 - 0.3 * Math.exp((x - a1) / this.S1);
      return 0.04 + 0.66 * Math.exp((a1 - x) / this.S2);
    }
    /** 平板（完全はく離）の法線力係数：Cn ≈ 1.98 sinα / (0.56 + 0.44|sinα|) */
    cnFlatPlate(a) { const s = Math.sin(a); return 1.98 * s / (0.56 + 0.44 * Math.abs(s)); }
    evalRaw(a) {
      const f = this.sepF(a), F = ((1 + Math.sqrt(f)) / 2) ** 2;
      const clA = this.clAtt(a), cn = this.cnFlatPlate(a);
      const w = smoothstep(20 * DEG, 30 * DEG, Math.abs(a));
      const cl = (1 - w) * clA * F + w * cn * Math.cos(a);
      const fn = clamp((f - 0.04) / 0.96, 0, 1);
      const cdSep = (1 - fn) * (1 - fn) * Math.abs(cn * Math.sin(a));
      const cdLift = this.kProfile * (cl - this.ClDmin) ** 2;
      return { cl, clAtt: clA, f, cdVar: cdLift + cdSep, cdSep };
    }
    /** 最小抗力（乱流平板摩擦 × 2 面 × 形状係数）。Re が小さいほど大きい */
    cdMin(Re) {
      const r = clamp(Re, 1e5, 1e8);
      return 2 * (0.455 / Math.pow(Math.log10(r), 2.58)) * this.FF;
    }
    /** 2 次元翼としての値：cl, dcl/dα, 可変抗力（摩擦以外）, はく離点 */
    lookup(a, out = this._lk) {
      const st = this.stall(a, this._st || (this._st = {})), at = this.att(a, this._at || (this._at = {}));
      out.cl = at.cl + st.ds; out.dcl = at.dcl + st.dds; out.f = st.f;
      out.cdv = this.kProfile * (out.cl - this.ClDmin) ** 2 + st.cdSep;
      return out;
    }
    cd(a, Re) { return this.cdMin(Re) + this.lookup(a).cdv; }
    /** 表示用の Cp 分布（節点ごと, 2 次元翼として迎角 a）。 */
    nodeCp(a, out) { const r = this.lookup(a); return this.cpFromState(r.cl, r.f, a >= 0, out); }
    /** 実際の Cl とはく離点 f から Cp 分布を作る。
     *  付着流：その Cl を与える迎角 α_v でのパネル法の Cp（= 1 − γ²）。
     *  失速時は「経験的な模式表示」：はく離点より後ろの上面（負迎角では下面）を
     *  一定圧力（はく離域の圧力台地）にする。 */
    cpFromState(cl, f, upperSide, out = new Float64Array(this.panel.N + 1)) {
      const P = this.panel, N = P.N, foil = this.foil, X = foil.x;
      const av = this.alpha0 + Math.asin(clamp(cl / this.K, -1, 1));
      const c = Math.cos(av), s = Math.sin(av);
      for (let j = 0; j <= N; j++) { const g = c * P.g0[j] + s * P.g90[j]; out[j] = 1 - g * g; }
      if (f < 0.985) {
        const le = foil.leIndex, dir = upperSide ? 1 : -1, end = upperSide ? N : 0;
        let cpS = null;
        for (let j = le; j !== end + dir; j += dir) {
          if (cpS === null) { if (X[j] >= f) cpS = out[j]; }
          else out[j] = cpS;
        }
      }
      return out;
    }
    /** 可視化用：失速で失われた循環（単位循環基底の係数） */
    circulationDeficit(a) { return 0.5 * (this.lookup(a).cl - this.clAtt(a)); }
  }

  /* ------------------------------------------------------------------
   * 5. プラントルの揚力線理論（非線形版）
   *    スパン方向 y = −(b/2)cosθ、循環 Γ(θ) = 2bV Σ A_n sin(nθ)（左右対称 → n は奇数）
   *    吹き下ろし角 α_i(θ) = Σ n A_n sin(nθ)/sinθ
   *    各断面：Γ = ½ V c Cl(α − α_i)  を満たす A_n をニュートン法で解く。
   *    CL = πAR·A1,  CDi = πAR·Σ n A_n²（誘導抗力）
   *    失速後は断面の Cl 傾斜が負になり解が一意でなくなる（隣り合う断面が交互に失速する
   *    非物理的な解）。そこで失速による減少分 ΔCl だけを翼弦程度の幅でスパン方向に平滑化した
   *    有効迎角 ᾱ で評価する（人工粘性の一種）。失速前は ΔCl ≈ 0 なので古典理論と一致する。
   * ------------------------------------------------------------------ */
  class LiftingLine {
    constructor(section, { AR, S, planform = 'rect', taper = 0.45, K = 20, aMin = -16, aMax = 30, aStep = 0.25 }) {
      this.sec = section; this.AR = AR; this.S = S; this.b = Math.sqrt(AR * S);
      this.planform = planform; this.taper = planform === 'taper' ? taper : 1;
      this.cRoot = planform === 'ellipse' ? 4 * S / (Math.PI * this.b) : 2 * S / (this.b * (1 + this.taper));
      this.K = K;
      this.n = Int32Array.from({ length: K }, (_, i) => 2 * i + 1);
      this.theta = Float64Array.from({ length: K }, (_, k) => ((k + 1) * Math.PI) / (2 * K));
      this.sinT = []; this.ratio = []; this.mu = new Float64Array(K);
      for (let k = 0; k < K; k++) {
        const th = this.theta[k], s = new Float64Array(K), r = new Float64Array(K);
        for (let i = 0; i < K; i++) { s[i] = Math.sin(this.n[i] * th); r[i] = (this.n[i] * s[i]) / Math.sin(th); }
        this.sinT.push(s); this.ratio.push(r);
        this.mu[k] = this.chord(Math.cos(th)) / (4 * this.b);
      }
      // 平均空力翼弦 MAC = (2/S)∫c² dy
      let m = 0; const nm = 400;
      for (let i = 0; i < nm; i++) { const e = (i + 0.5) / nm, c = this.chord(e); m += c * c * (this.b / 2) / nm; }
      this.mac = (2 / S) * m;
      this.sigma = 0.6 * this.mac;                      // 失速分の平滑化幅
      this.Wk = this.smoothMatrix(this.theta);
      // WR = W·r（平滑化した有効迎角の A_n による微分）
      this.WR = this.Wk.map((wrow) => {
        const out = new Float64Array(K);
        for (let j = 0; j < K; j++) { const rj = this.ratio[j]; for (let i = 0; i < K; i++) out[i] += wrow[j] * rj[i]; }
        return out;
      });
      this.nInt = 64;                                   // スパン積分用の θ 中点
      this.thInt = Float64Array.from({ length: this.nInt }, (_, j) => ((j + 0.5) * Math.PI) / (2 * this.nInt));
      this.Wint = this.smoothMatrix(this.thInt);
      this.buildTable(aMin * DEG, aMax * DEG, aStep * DEG);
    }
    /** θ の点列（半翼）に対するガウス平滑化行列（翼根に対する鏡像を含む） */
    smoothMatrix(thetas) {
      const n = thetas.length, hb = this.b / 2, y = Array.from(thetas, (t) => hb * Math.cos(t)), dy = [];
      for (let j = 0; j < n; j++) {
        const a = y[Math.max(0, j - 1)], c = y[Math.min(n - 1, j + 1)];
        dy.push(Math.abs(c - a) / (j > 0 && j < n - 1 ? 2 : 1) + 1e-9);   // 点が受け持つ幅
      }
      const s2 = 2 * this.sigma * this.sigma;
      return y.map((yk) => {
        const row = new Float64Array(n); let sum = 0;
        for (let j = 0; j < n; j++) {
          row[j] = (Math.exp(-((yk - y[j]) ** 2) / s2) + Math.exp(-((yk + y[j]) ** 2) / s2)) * dy[j];
          sum += row[j];
        }
        for (let j = 0; j < n; j++) row[j] /= sum;
        return row;
      });
    }
    /** 翼弦長 c(η), η = |2y/b| */
    chord(eta) {
      if (this.planform === 'ellipse') return this.cRoot * Math.sqrt(Math.max(0, 1 - eta * eta));
      return this.cRoot * (1 - (1 - this.taper) * eta);
    }
    aiAt(th, A) {
      const s = Math.sin(th);
      let v = 0;
      if (s < 1e-6) { for (let i = 0; i < this.K; i++) v += this.n[i] * this.n[i] * A[i]; return v; }
      for (let i = 0; i < this.K; i++) v += this.n[i] * A[i] * Math.sin(this.n[i] * th);
      return v / s;
    }
    /** Γ/V∞ [m] */
    gammaAt(th, A) { let v = 0; for (let i = 0; i < this.K; i++) v += A[i] * Math.sin(this.n[i] * th); return 2 * this.b * v; }
    residual(alpha, A, R, J) {
      const K = this.K, sec = this.sec, at = this._at || (this._at = {}), st = this._st || (this._st = {});
      const G = this._G || (this._G = new Float64Array(K)), ae = this._ae || (this._ae = new Float64Array(K));
      for (let k = 0; k < K; k++) {
        const s = this.sinT[k], r = this.ratio[k];
        let g = 0, ai = 0;
        for (let i = 0; i < K; i++) { g += A[i] * s[i]; ai += A[i] * r[i]; }
        G[k] = g; ae[k] = alpha - ai;
      }
      let nrm = 0;
      for (let k = 0; k < K; k++) {
        const w = this.Wk[k];
        let abar = 0;
        for (let j = 0; j < K; j++) abar += w[j] * ae[j];
        sec.att(ae[k], at); sec.stall(abar, st);
        R[k] = G[k] - this.mu[k] * (at.cl + st.ds);
        nrm += R[k] * R[k];
        if (J) {
          const Jk = J[k], s = this.sinT[k], r = this.ratio[k], wr = this.WR[k];
          for (let i = 0; i < K; i++) Jk[i] = s[i] + this.mu[k] * (at.dcl * r[i] + st.dds * wr[i]);
        }
      }
      return Math.sqrt(nrm);
    }
    /** ニュートン法（直線探索付き）で A_n を求める */
    solve(alpha, A0) {
      const K = this.K;
      const A = A0 ? Float64Array.from(A0) : new Float64Array(K);
      const R = new Float64Array(K), R2 = new Float64Array(K), An = new Float64Array(K);
      const J = Array.from({ length: K }, () => new Float64Array(K));
      let nrm = this.residual(alpha, A, R, J), it = 0;
      for (; it < 60 && nrm > 1e-13; it++) {
        const d = solveDense(J, R);
        let lam = 1, nNew = Infinity;
        for (let ls = 0; ls < 14; ls++) {
          for (let i = 0; i < K; i++) An[i] = A[i] - lam * d[i];
          nNew = this.residual(alpha, An, R2, null);
          if (nNew < nrm) break;
          lam *= 0.5;
        }
        if (!(nNew < nrm)) break;
        A.set(An);
        nrm = this.residual(alpha, A, R, J);
      }
      return { A, residual: nrm, iterations: it };
    }
    /** 与えた θ 点列（半翼）での断面状態：有効迎角・平滑化迎角・Cl・はく離点・抗力・循環 */
    stations(alpha, A, thetas, W) {
      const n = thetas.length, sec = this.sec, at = {}, st = {};
      const r = { theta: thetas, eta: new Float64Array(n), chord: new Float64Array(n), ai: new Float64Array(n), ae: new Float64Array(n),
        abar: new Float64Array(n), cl: new Float64Array(n), clAtt: new Float64Array(n), f: new Float64Array(n), cdv: new Float64Array(n), gamma: new Float64Array(n) };
      for (let k = 0; k < n; k++) {
        r.eta[k] = Math.cos(thetas[k]); r.chord[k] = this.chord(r.eta[k]);
        r.ai[k] = this.aiAt(thetas[k], A); r.ae[k] = alpha - r.ai[k];
        r.gamma[k] = this.gammaAt(thetas[k], A);
      }
      for (let k = 0; k < n; k++) {
        const w = W[k]; let ab = 0;
        for (let j = 0; j < n; j++) ab += w[j] * r.ae[j];
        r.abar[k] = ab;
        sec.att(r.ae[k], at); sec.stall(ab, st);
        r.clAtt[k] = at.cl; r.cl[k] = at.cl + st.ds; r.f[k] = st.f;
        r.cdv[k] = sec.kProfile * (r.cl[k] - sec.ClDmin) ** 2 + st.cdSep;
      }
      return r;
    }
    /** 迎角ごとの表（CL, CDi, 形状抗力の可変分, 吹き下ろし角 など）を作る */
    buildTable(aMin, aMax, step) {
      const K = this.K, n = Math.round((aMax - aMin) / step) + 1;
      const T = {
        aMin, step, n,
        CL: new Float64Array(n), CDi: new Float64Array(n), CDpv: new Float64Array(n),
        aiRoot: new Float64Array(n), e: new Float64Array(n), fMin: new Float64Array(n),
        stallFrac: new Float64Array(n), CLint: new Float64Array(n), resid: new Float64Array(n),
        A: new Float64Array(n * K),
      };
      this.table = T;
      const i0 = Math.round(-aMin / step);
      const store = (i, sol) => {
        const A = sol.A, a = aMin + i * step;
        T.A.set(A, i * K);
        T.resid[i] = sol.residual;
        T.CL[i] = Math.PI * this.AR * A[0];
        let cdi = 0; for (let j = 0; j < K; j++) cdi += this.n[j] * A[j] * A[j];
        T.CDi[i] = Math.PI * this.AR * cdi;
        // スパン方向の積分（θ の中点則）
        const S = this.stations(a, A, this.thInt, this.Wint), dth = (Math.PI / 2) / this.nInt, hb = this.b / 2;
        let cdp = 0, clI = 0, fMin = 1, stall = 0;
        for (let j = 0; j < this.nInt; j++) {
          const dy = hb * Math.sin(this.thInt[j]) * dth;
          cdp += S.chord[j] * S.cdv[j] * dy; clI += S.chord[j] * S.cl[j] * dy;
          if (S.f[j] < fMin) fMin = S.f[j];
          if (S.f[j] < 0.7) stall += dy;
        }
        T.CDpv[i] = (2 / this.S) * cdp; T.CLint[i] = (2 / this.S) * clI;
        T.fMin[i] = fMin; T.stallFrac[i] = stall / hb;
        T.aiRoot[i] = this.aiAt(Math.PI / 2, A);
        T.e[i] = T.CDi[i] > 1e-10 ? (T.CL[i] * T.CL[i]) / (Math.PI * this.AR * T.CDi[i]) : NaN;
      };
      let A = null;
      for (let i = i0; i < n; i++) { const s = this.solve(aMin + i * step, A); store(i, s); A = s.A; }
      A = T.A.slice(i0 * K, i0 * K + K);
      for (let i = i0 - 1; i >= 0; i--) { const s = this.solve(aMin + i * step, A); store(i, s); A = s.A; }
    }
    _idx(alpha) {
      const T = this.table;
      const u = clamp((alpha - T.aMin) / T.step, 0, T.n - 1.000001);
      const i = u | 0;
      return [i, u - i];
    }
    /** 迎角 α における翼全体の係数（表の補間） */
    coeffs(alpha, out = {}) {
      const T = this.table, [i, t] = this._idx(alpha);
      const L = (arr) => arr[i] + t * (arr[i + 1] - arr[i]);
      out.CL = L(T.CL); out.CDi = L(T.CDi); out.CDpv = L(T.CDpv);
      out.aiRoot = L(T.aiRoot); out.fMin = L(T.fMin); out.stallFrac = L(T.stallFrac);
      out.e = out.CDi > 1e-8 ? (out.CL * out.CL) / (Math.PI * this.AR * out.CDi) : NaN;
      return out;
    }
    interpA(alpha, out = new Float64Array(this.K)) {
      const T = this.table, K = this.K, [i, t] = this._idx(alpha);
      for (let j = 0; j < K; j++) out[j] = T.A[i * K + j] + t * (T.A[(i + 1) * K + j] - T.A[i * K + j]);
      return out;
    }
    /** 描画用：η = |2y/b| の各点（0→1 の昇順）での 翼弦・有効迎角・Cl・はく離点・循環 */
    spanState(alpha, etas, A = this.interpA(alpha)) {
      const cache = this._spanCache || (this._spanCache = new Map());
      let c = cache.get(etas);
      if (!c) {
        const th = Float64Array.from(etas, (e) => Math.acos(clamp(e, 0, 1)));
        c = { th, W: this.smoothMatrix(th) };
        cache.set(etas, c);
      }
      return this.stations(alpha, A, c.th, c.W);
    }
  }

  /* ------------------------------------------------------------------
   * 6. 後流渦モデル（翼端渦・吹き下ろしの可視化用）
   *    揚力線の循環分布 Γ(y) を M 本の後流渦糸に分け（強さ = 隣の区間との Γ の差）、
   *    後縁から下流へ伸ばす。下流では翼端渦の中心 z_c へ巻き上がる。
   *    誘導速度はビオ・サバールの法則（渦核半径 rc で特異性を除去）。V∞=1 で無次元。
   * ------------------------------------------------------------------ */
  function biotSavartSegment(px, py, pz, ax, ay, az, bx, by, bz, s, rc2, out) {
    const r1x = px - ax, r1y = py - ay, r1z = pz - az, r2x = px - bx, r2y = py - by, r2z = pz - bz;
    const cx = r1y * r2z - r1z * r2y, cy = r1z * r2x - r1x * r2z, cz = r1x * r2y - r1y * r2x;
    const r0x = bx - ax, r0y = by - ay, r0z = bz - az;
    const den = cx * cx + cy * cy + cz * cz + rc2 * (r0x * r0x + r0y * r0y + r0z * r0z);
    const r1 = Math.sqrt(r1x * r1x + r1y * r1y + r1z * r1z), r2 = Math.sqrt(r2x * r2x + r2y * r2y + r2z * r2z);
    if (den < 1e-24 || r1 < 1e-12 || r2 < 1e-12) return;
    const dot = r0x * (r1x / r1 - r2x / r2) + r0y * (r1y / r1 - r2y / r2) + r0z * (r1z / r1 - r2z / r2);
    const k = (s / (4 * Math.PI)) * dot / den;
    out[0] += k * cx; out[1] += k * cy; out[2] += k * cz;
  }

  class WakeModel {
    constructor() { this.fil = []; this.rc = 0.3; this.zc = 0; this.gammaRoot = 0; }
    /** wing: LiftingLine, alpha: 翼の迎角。opts.straight=true で巻き上がりなし・1/4翼弦から直進（検証用） */
    build(wing, alpha, opts = {}) {
      const M = opts.M || 10, hb = wing.b / 2, A = wing.interpA(alpha);
      const ye = [], G = [0];
      for (let k = 0; k <= M; k++) ye.push(hb * Math.sin((0.5 * Math.PI * k) / M));
      for (let k = 1; k <= M; k++) G.push(wing.gammaAt(Math.acos(clamp(0.5 * (ye[k - 1] + ye[k]) / hb, 0, 1)), A));
      G.push(0);
      const dG = [0];
      let sum = 0, mom = 0;
      for (let k = 1; k <= M; k++) { dG.push(G[k] - G[k + 1]); sum += dG[k]; mom += dG[k] * ye[k]; }
      this.gammaRoot = G[1];
      this.zc = Math.abs(sum) > 1e-9 ? clamp(mom / sum, 0.3 * hb, hb) : (Math.PI / 4) * hb;
      const ai = wing.aiAt(Math.PI / 2, A);
      const eps = opts.straight ? 0 : 1.5 * ai;               // 後流は吹き下ろしの分だけ下がる
      const da = opts.straight ? 0 : alpha - eps;
      const dx = Math.cos(da), dy = Math.sin(da);
      const Lr = 1.4 * wing.b, far = 60 * wing.b;
      this.fil = [];
      for (let k = 1; k <= M; k++) {
        const z0 = ye[k], c = wing.chord(z0 / hb);
        const x0 = opts.straight ? 0 : 0.75 * Math.max(c, 0.02 * wing.cRoot);
        const P0 = [x0, 0, z0];
        let pts;
        if (opts.straight) pts = [P0, [x0 + far, 0, z0]];
        else {
          const z1 = z0 + (this.zc - z0) * 0.45, z2 = this.zc + (z0 - this.zc) * 0.06;
          pts = [P0, [x0 + dx * 0.35 * Lr, dy * 0.35 * Lr, z1], [x0 + dx * Lr, dy * Lr, z2], [x0 + dx * (Lr + far), dy * (Lr + far), z2]];
        }
        this.fil.push({ pts, s: -dG[k] });   // +z 側の渦糸（下流向き）は負の強さで内側に吹き下ろし
      }
      this.rc = opts.rc !== undefined ? opts.rc : 0.035 * wing.b;
      return this;
    }
    /** 点 p（機体座標, m）の誘導速度（V∞=1 単位）。左右対称に鏡像を加える */
    induced(px, py, pz, out = [0, 0, 0]) {
      out[0] = out[1] = out[2] = 0;
      const rc2 = this.rc * this.rc;
      for (const f of this.fil) {
        const P = f.pts;
        for (let i = 0; i + 1 < P.length; i++) {
          const a = P[i], b = P[i + 1];
          biotSavartSegment(px, py, pz, a[0], a[1], a[2], b[0], b[1], b[2], f.s, rc2, out);
          biotSavartSegment(px, py, pz, a[0], a[1], -a[2], b[0], b[1], -b[2], -f.s, rc2, out);
        }
      }
      return out;
    }
    /** 流線追跡（翼端渦のらせん表示用）。u = 一様流 + 誘導速度 */
    trace(p0, alpha, ds, nSteps) {
      const pts = [p0.slice()], v = [0, 0, 0], fx = Math.cos(alpha), fy = Math.sin(alpha);
      let p = p0.slice();
      const f = (q) => { this.induced(q[0], q[1], q[2], v); const u = [fx + v[0], fy + v[1], v[2]]; const m = Math.hypot(u[0], u[1], u[2]) || 1; return [u[0] / m, u[1] / m, u[2] / m]; };
      for (let i = 0; i < nSteps; i++) {
        const k1 = f(p), k2 = f([p[0] + 0.5 * ds * k1[0], p[1] + 0.5 * ds * k1[1], p[2] + 0.5 * ds * k1[2]]);
        p = [p[0] + ds * k2[0], p[1] + ds * k2[1], p[2] + ds * k2[2]];
        pts.push(p);
      }
      return pts;
    }
  }

  /* ------------------------------------------------------------------
   * 7. 機体モデル（セスナ172 程度の小型機）
   * ------------------------------------------------------------------ */
  class AircraftModel {
    constructor() {
      this.mass = 1000;          // 質量 [kg]
      this.S = 16.2;             // 主翼面積 [m²]（アスペクト比を変えても一定）
      this.Iyy = 1350;           // ピッチ慣性モーメント [kg·m²]
      this.CD0body = 0.018;      // 胴体・尾翼・脚などの有害抗力係数
      this.CmAlpha = -0.9;       // 静安定（尾翼の復元モーメント）[1/rad]
      this.Cmq = -12;            // ピッチ減衰
      this.muRoll = 0.02;        // 地上の転がり摩擦係数
      this.Vc = 25;              // プロペラ特性速度 [m/s]（これより速いと出力 P ≈ T0·Vc 一定）
      this.nPanels = 150;
      this.version = 0;
    }
    get W() { return this.mass * G0; }
    configure({ naca, AR, planform }) {
      this.foil = new NacaAirfoil(naca, this.nPanels);
      this.panel = new VortexPanelSolver(this.foil);
      this.section = new SectionModel(this.panel);
      this.wing = new LiftingLine(this.section, { AR, S: this.S, planform });
      this.config = { naca: this.foil.code, AR, planform };
      this.version++;
      return this;
    }
    /** プロペラ推力：静止推力 T0、高速では一定出力（T ≈ P/V）。
     *  速度が上がると推力が減るので、上昇中の長周期運動（フゴイド）が減衰する。 */
    thrustAt(T0, V) { return T0 / Math.sqrt(1 + (V / this.Vc) ** 2); }
    reynolds(V, rho, mu) { return (rho * Math.max(V, 0.1) * this.wing.mac) / mu; }
    /** 全機の空力：CL, CD（= 形状抗力 + 誘導抗力 + 有害抗力）と力 */
    aero(alpha, V, rho, mu, out = {}) {
      const w = this.wing.coeffs(alpha, out);
      const Re = this.reynolds(V, rho, mu);
      const CDpMin = this.section.cdMin(Re);
      out.Re = Re;
      out.CDp = CDpMin + w.CDpv;
      out.CD0 = this.CD0body;
      out.CD = out.CDp + w.CDi + this.CD0body;
      out.q = 0.5 * rho * V * V;
      out.L = out.q * this.S * out.CL;
      out.D = out.q * this.S * out.CD;
      return out;
    }
    /** 与えた Re で L/D が最大となる迎角 */
    bestLD(Re) {
      const T = this.wing.table, cdm = this.section.cdMin(Re);
      let best = { alpha: 0, LD: 0 };
      for (let i = 0; i < T.n; i++) {
        const CD = cdm + T.CDpv[i] + T.CDi[i] + this.CD0body, LD = T.CL[i] / CD;
        if (LD > best.LD) best = { alpha: T.aMin + i * T.step, LD, CL: T.CL[i], CD };
      }
      return best;
    }
  }

  /* ------------------------------------------------------------------
   * 8. 飛行シミュレーション（縦 3 自由度, RK4, 固定刻み）
   *    状態 s = [x, z, vx, vz, θ, q]
   *      x: 水平距離, z: 対地高度, (vx, vz): 対地速度 = 対気速度（無風）
   *      θ: ピッチ角（機首上げ正）, q: ピッチ角速度
   *    経路角 γ = atan2(vz, vx), 迎角 α = θ − γ
   *    並進： m·dv/dt = L + D + W + T（4 つの力のベクトル和）
   *    回転： Iyy·dq/dt = M = q̄Sc̄[Cmα(α − α_cmd) + Cmq·q c̄/(2V)]
   *           α_cmd はエレベーターで決まる「トリム迎角」（迎角スライダー）。
   *    地上では垂直抗力 N と転がり摩擦が加わる（滑走中のみ）。
   * ------------------------------------------------------------------ */
  class FlightSim {
    constructor(aircraft) {
      this.ac = aircraft;
      this.s = new Float64Array(6);
      this.mode = 'tunnel';               // 'tunnel' | 'powered' | 'glide'
      this.alphaCmd = 5 * DEG;
      this.thrust = 0;
      this.hRef = 0;                      // 地面の標高 [m]（空気密度の基準）
      this.thetaGroundMax = 12 * DEG;     // 尻もち角
      this.t = 0;
      this.tunnel = { alpha: 5 * DEG, V: 40 };
      this.events = [];
      this._k = [0, 1, 2, 3].map(() => new Float64Array(6));
      this._tmp = new Float64Array(6);
      this._ev = { aero: {} };
      this.wasGround = false;
    }
    /** 状態 s における全ての力を評価（描画・表示にもこの結果を使う） */
    evaluate(s, out = this._ev) {
      const ac = this.ac, x = s[0], z = s[1], vx = s[2], vz = s[3], th = s[4], q = s[5];
      const V = Math.hypot(vx, vz);
      const gamma = V > 1e-6 ? Math.atan2(vz, vx) : 0;
      const alpha = th - gamma;
      const atm = Atmosphere.at(this.hRef + z);
      const a = ac.aero(alpha, V, atm.rho, atm.mu, out.aero);
      const T = this.mode === 'glide' ? 0 : ac.thrustAt(this.thrust, V);
      const W = ac.W, sg = Math.sin(gamma), cg = Math.cos(gamma);
      let Fx = -a.L * sg - a.D * cg + T * Math.cos(th);
      let Fz = a.L * cg - a.D * sg + T * Math.sin(th) - W;
      const mac = ac.wing.mac, Veff = Math.max(V, 5);
      let M = a.q * ac.S * mac * (ac.CmAlpha * (alpha - this.alphaCmd) + (ac.Cmq * q * mac) / (2 * Veff));
      let N = 0, Ff = 0;
      const ground = this.mode !== 'tunnel' && z <= 1e-4 && vz <= 1e-4;
      if (ground) {
        if (Fz < 0) { N = -Fz; Fz = 0; }
        const fmax = ac.muRoll * N;
        if (vx > 0.05) Ff = -fmax; else if (vx < -0.05) Ff = fmax; else Ff = -clamp(Fx, -fmax, fmax);

      }
      Object.assign(out, { x, z, V, gamma, alpha, theta: th, q, atm, T, W, L: a.L, D: a.D, Fx, Fz, M, N, Ff, onGround: ground, ax: Fx / ac.mass, az: Fz / ac.mass });

      ds[0] = s[2]; ds[1] = s[3]; ds[2] = e.ax; ds[3] = e.az; ds[4] = s[5]; ds[5] = e.M / this.ac.Iyy;

    /** 4 次のルンゲ・クッタ法で dt だけ進める */
    step(dt) {

      const s = this.s, [k1, k2, k3, k4] = this._k, tmp = this._tmp;
      this.deriv(s, k1);
      for (let i = 0; i < 6; i++) tmp[i] = s[i] + 0.5 * dt * k1[i];
      this.deriv(tmp, k2);
      for (let i = 0; i < 6; i++) tmp[i] = s[i] + 0.5 * dt * k2[i];
      this.deriv(tmp, k3);
      for (let i = 0; i < 6; i++) tmp[i] = s[i] + dt * k3[i];
      this.deriv(tmp, k4);
      for (let i = 0; i < 6; i++) s[i] += (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
      // 地面拘束（めり込まない・機首は地面より下がらない・尻もち角で止まる）
      if (s[1] < 0) { s[1] = 0; if (s[3] < 0) s[3] = 0; if (this.mode === 'glide') this.events.push('touchdown'); }
      if (s[1] <= 1e-4) {
        if (s[4] < 0) { s[4] = 0; if (s[5] < 0) s[5] = 0; }
        if (s[4] > this.thetaGroundMax) { s[4] = this.thetaGroundMax; if (s[5] > 0) s[5] = 0; }
      }
      const onG = s[1] <= 0.05;
      if (this.wasGround && !onG && s[1] > 0.3) { this.events.push('liftoff'); this.wasGround = false; }
      if (onG && s[1] <= 1e-4) this.wasGround = true;

    }
    resetPowered() { this.mode = 'powered'; this.s.fill(0); this.t = 0; this.wasGround = true; }
    /** 迎角 alpha でつり合い滑空する状態（L = W cosγ, D = W sinγ） */
    trimGlide(alpha, z0) {
      const ac = this.ac, atm = Atmosphere.at(this.hRef + z0);
      let V = 40, gamma = 0, ok = true;
      for (let it = 0; it < 8; it++) {
        const a = ac.aero(alpha, V, atm.rho, atm.mu, {});
        if (a.CL < 0.03) { ok = false; break; }
        gamma = -Math.atan(a.CD / a.CL);
        V = Math.sqrt((2 * ac.W * Math.cos(gamma)) / (atm.rho * ac.S * a.CL));
      }

    }
    resetGlide(z0 = 800) {
      this.mode = 'glide'; this.t = 0; this.wasGround = false;
      const tr = this.trimGlide(this.alphaCmd, z0);
      const V = tr.ok ? tr.V : 45, g = tr.ok ? tr.gamma : -0.1;
      this.s.set([0, z0, V * Math.cos(g), V * Math.sin(g), this.alphaCmd + g, 0]);
      return tr;
    }
    setTunnel(alpha, V) {
      this.mode = 'tunnel';
      this.tunnel.alpha = alpha; this.tunnel.V = V;
      this.s.set([0, 0, V, 0, alpha, 0]);
    }
    /** 飛行中に対気速度を与える（方向は保ったまま） */
    setAirspeed(Vn) {
      const s = this.s, V = Math.hypot(s[2], s[3]);
      if (V > 0.1) { s[2] *= Vn / V; s[3] *= Vn / V; }
      else { s[2] = Vn * Math.cos(s[4]); s[3] = s[1] > 0.05 ? Vn * Math.sin(s[4]) : 0; }
    }
  }

  /* ------------------------------------------------------------------
   * 9. セルフテスト（数値計算の正しさを理論値と比べる）
   * ------------------------------------------------------------------ */
  const SelfTest = {
    run() {
      const out = [];
      const add = (name, ok, detail) => out.push({ name, ok: !!ok, detail });
      const TWO_PI = 2 * Math.PI;

      // (1) 対称翼 NACA 0012：Cl(0)=0, 揚力傾斜 ≈ 2π（厚さの補正 2π(1+0.77t/c)）
      const p12 = new VortexPanelSolver(new NacaAirfoil('0012', 150));
      const slope12 = (p12.clInviscid(1 * DEG) - p12.clInviscid(-1 * DEG)) / (2 * DEG);
      add('NACA0012: α=0 で Cl=0', Math.abs(p12.Cl0) < 1e-6, `Cl(0) = ${p12.Cl0.toExponential(2)}`);
      add('NACA0012: 揚力傾斜 dCl/dα ≈ 2π', slope12 / TWO_PI > 0.95 && slope12 / TWO_PI < 1.15,
        `${slope12.toFixed(3)} /rad = ${(slope12 / TWO_PI).toFixed(3)} × 2π`);
      const th12 = TWO_PI * (1 + 0.77 * 0.12);
      add('NACA0012: 厚翼補正 2π(1+0.77t) と一致', Math.abs(slope12 / th12 - 1) < 0.03,
        `理論 ${th12.toFixed(3)} /rad, 誤差 ${((slope12 / th12 - 1) * 100).toFixed(2)}%`);

      // (2) 薄い翼 NACA 0002 → 薄翼理論 2π に収束
      const p02 = new VortexPanelSolver(new NacaAirfoil('0002', 150));
      const slope02 = (p02.clInviscid(1 * DEG) - p02.clInviscid(-1 * DEG)) / (2 * DEG);
      add('NACA0002（薄翼）: dCl/dα → 2π', Math.abs(slope02 / TWO_PI - 1) < 0.03,
        `${slope02.toFixed(3)} /rad = ${(slope02 / TWO_PI).toFixed(3)} × 2π`);

      // (3) キャンバー翼 NACA 2412：零揚力角・モーメントを薄翼理論と比較
      const f24 = new NacaAirfoil('2412', 150), p24 = new VortexPanelSolver(f24);
      let aL0 = 0, A1 = 0, A2 = 0; const nq = 4000;
      for (let i = 0; i < nq; i++) {
        const th = ((i + 0.5) * Math.PI) / nq, x = 0.5 * (1 - Math.cos(th)), dz = f24.camber(x).dyc, d = Math.PI / nq;
        aL0 += dz * (Math.cos(th) - 1) * d; A1 += dz * Math.cos(th) * d; A2 += dz * Math.cos(2 * th) * d;
      }
      aL0 *= -1 / Math.PI; A1 *= 2 / Math.PI; A2 *= 2 / Math.PI;
      const cmThin = (Math.PI / 4) * (A2 - A1);
      const aL0p = -Math.atan2(p24.Cl0, p24.Cl90);
      add('NACA2412: 零揚力角 α_L0（薄翼理論）', Math.abs(aL0p - aL0) < 0.3 * DEG,
        `パネル法 ${(aL0p / DEG).toFixed(2)}°, 薄翼理論 ${(aL0 / DEG).toFixed(2)}°`);
      const pf = p24.pressureForces(4 * DEG);
      add('NACA2412: Cm(1/4翼弦) ≈ 薄翼理論', Math.abs(pf.cm - cmThin) < 0.012,
        `パネル法 ${pf.cm.toFixed(4)}, 薄翼理論 ${cmThin.toFixed(4)}`);

      // (4) クッタ条件と、循環による Cl と圧力積分による Cl の一致
      const g = p24.gamma(5 * DEG);
      add('クッタ条件 γ(後縁下) + γ(後縁上) = 0', Math.abs(g[0] + g[p24.N]) < 1e-9, `残差 ${Math.abs(g[0] + g[p24.N]).toExponential(2)}`);
      const pf5 = p24.pressureForces(5 * DEG), clc = p24.clInviscid(5 * DEG);
      add('Cl(循環) = Cl(圧力積分)', Math.abs(pf5.cl / clc - 1) < 0.02, `${clc.toFixed(4)} vs ${pf5.cl.toFixed(4)}`);
      add('ポテンシャル流の抗力 ≈ 0（ダランベール）', Math.abs(pf5.cd) < 0.005, `Cd_p = ${pf5.cd.toExponential(2)}`);

      // (5) 揚力線理論：楕円翼 + 線形断面 → e = 1, CLα = a0/(1 + a0/(πAR))
      const lin = {   // 失速のない理想的な線形断面 Cl = 2πα
        kProfile: 0, ClDmin: 0,
        att(a, o) { o.cl = TWO_PI * a; o.dcl = TWO_PI; return o; },
        stall(a, o) { o.ds = 0; o.dds = 0; o.f = 1; o.cdSep = 0; return o; },
      };
      const ARt = 8, ell = new LiftingLine(lin, { AR: ARt, S: 16, planform: 'ellipse', aMin: -4, aMax: 8, aStep: 1 });
      const ce = ell.coeffs(5 * DEG), clTh = (TWO_PI / (1 + TWO_PI / (Math.PI * ARt))) * 5 * DEG;
      add('揚力線：楕円翼のスパン効率 e = 1', Math.abs(ce.e - 1) < 0.01, `e = ${ce.e.toFixed(4)}`);
      add('揚力線：楕円翼 CL = a0α/(1+a0/πAR)', Math.abs(ce.CL / clTh - 1) < 0.01, `${ce.CL.toFixed(4)} vs 理論 ${clTh.toFixed(4)}`);
      const rect = new LiftingLine(lin, { AR: 6, S: 16, planform: 'rect', aMin: -4, aMax: 8, aStep: 1 });
      const cr = rect.coeffs(5 * DEG);
      add('揚力線：矩形翼 AR=6 で e < 1', cr.e > 0.85 && cr.e < 0.995, `e = ${cr.e.toFixed(4)}`);

      // (6) 後流渦（ビオ・サバール）の吹き下ろし = 揚力線の α_i
      const wk = new WakeModel().build(ell, 5 * DEG, { straight: true, M: 60, rc: 1e-4 });
      const w0 = wk.induced(0, 0, 0)[1], aiR = ell.aiAt(Math.PI / 2, ell.interpA(5 * DEG));
      add('後流渦の吹き下ろし w/V = −α_i（翼中央）', w0 < 0 && Math.abs(-w0 / aiR - 1) < 0.05,
        `ビオ・サバール ${(-w0).toFixed(4)}, 揚力線 ${aiR.toFixed(4)}`);

      // (7) 飛行力学：定常滑空で「水平距離 / 高度損失 = L/D」
      const ac = new AircraftModel().configure({ naca: '2412', AR: 7.5, planform: 'rect' });
      const sim = new FlightSim(ac);
      sim.alphaCmd = 5 * DEG; sim.resetGlide(1500);
      for (let i = 0; i < 120 * 30; i++) sim.step(1 / 120);
      const x0 = sim.s[0], z0 = sim.s[1];
      for (let i = 0; i < 120 * 30; i++) sim.step(1 / 120);
      const ratio = (sim.s[0] - x0) / (z0 - sim.s[1]);
      const ev = sim.evaluate(sim.s, { aero: {} });
      const LD = ev.L / ev.D;
      add('滑空：水平距離/高度損失 = L/D', Math.abs(ratio / LD - 1) < 0.03, `距離比 ${ratio.toFixed(2)}, L/D ${LD.toFixed(2)}`);
      add('滑空：W·sinγ ≈ D（速度が保たれる）', Math.abs((-ev.W * Math.sin(ev.gamma)) / ev.D - 1) < 0.03,
        `W sinγ = ${(-ev.W * Math.sin(ev.gamma)).toFixed(0)} N, D = ${ev.D.toFixed(0)} N`);
      return out;
    },
  };

  global.AeroLab = {
    DEG, G0, clamp, smoothstep, Atmosphere, NacaAirfoil, VortexPanelSolver, linearVortexInfluence,
    SectionModel, LiftingLine, WakeModel, biotSavartSegment, AircraftModel, FlightSim, SelfTest,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script type="module">

/** 翼型 foil を nSt 個の断面でロフトした形状。map(s, X, Y) → [x, y, z] */
function loft(foil, nSt, map) {
  const N1 = foil.x.length, pos = [], idx = [];
  for (let s = 0; s < nSt; s++) for (let j = 0; j < N1; j++) pos.push(...map(s, foil.x[j], foil.y[j]));
  for (let s = 0; s < nSt - 1; s++) {
    for (let j = 0; j < N1 - 1; j++) {
      const a = s * N1 + j, b = (s + 1) * N1 + j, c = s * N1 + j + 1, d = (s + 1) * N1 + j + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const nSurf = pos.length / 3;
  for (const s of [0, nSt - 1]) {           // 両端のふた
    const cen = pos.length / 3;
    pos.push(...map(s, 0.35, foil.camber(0.35).yc));
    const st = pos.length / 3;
    for (let j = 0; j < N1; j++) pos.push(...map(s, foil.x[j], foil.y[j]));
    for (let j = 0; j < N1 - 1; j++) (s === 0 ? idx.push(cen, st + j, st + j + 1) : idx.push(cen, st + j + 1, st + j));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return { geo, nSurf, N1 };
}

function buildWing() {
  if (WING.mesh) { acGroup.remove(WING.mesh); WING.mesh.geometry.dispose(); }
  const wing = aircraft.wing, hb = wing.b / 2, zs = [], cs = [];
  for (let s = 0; s <= 2 * NSH; s++) {
    const u = (s - NSH) / NSH, eta = Math.sin((Math.PI / 2) * Math.abs(u));
    zs.push(Math.sign(u) * eta * hb);
    cs.push(Math.max(wing.chord(eta), 0.035 * wing.cRoot));
  }
  const { geo, nSurf, N1 } = loft(aircraft.foil, zs.length, (s, X, Y) => [-cs[s] / 4 + cs[s] * X, cs[s] * Y, zs[s]]);
  const col = new Float32Array(geo.attributes.position.count * 3).fill(0.55);
  WING.colors = new THREE.BufferAttribute(col, 3);
  geo.setAttribute('color', WING.colors);
  WING.mesh = new THREE.Mesh(geo, matWing);
  WING.N1 = N1; WING.nSurf = nSurf; WING.gray = false;
  acGroup.add(WING.mesh);
}

    if (!this.group.visible) return;
    const hl = Math.min(len * 0.4, this.r * 7);
    this.group.position.copy(origin);
    this.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    this.shaft.scale.set(1, len - hl, 1);
    this.head.scale.set(1, hl, 1); this.head.position.y = len - hl;
    this.tip.copy(dir).multiplyScalar(len).add(origin);
  }
}

/* ---------------------------------------------------------------------
 * 8. 翼型まわりの速度場を GPU で「焼き込む」
 *    パネル法の 3 つの基底解（α=0°, α=90°, 単位循環）が誘導する速度を、
 *    線形渦パネルの解析式で格子点ごとに計算し、半精度浮動小数テクスチャに保存。
 *    任意の迎角 α の流れ = (cosα, sinα) + cosα·U0 + sinα·U90 + ΔΓ·UΓ
 *    （翼型を変えたときだけ再計算。毎フレームの粒子はテクスチャを読むだけ）
 * ------------------------------------------------------------------- */
const QUAD_VS = /* glsl */ `varying vec2 vUv; void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const FIELD = {
  near: { dom: new THREE.Vector4(-0.3, -0.5, 1.4, 0.5), w: 544, h: 320, rt: null },
  far: { dom: new THREE.Vector4(-3.5, -3.2, 5.0, 3.2), w: 340, h: 256, rt: null },
  panelTex: null,
};
const bakeMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  uniforms: { uPanels: { value: null }, uN: { value: 150 }, uDom: { value: new THREE.Vector4() } },
  vertexShader: QUAD_VS,
  fragmentShader: /* glsl */ `
    precision highp float;
    precision highp sampler2D;
    uniform sampler2D uPanels; uniform int uN; uniform vec4 uDom;
    varying vec2 vUv;
    layout(location = 0) out vec4 oA;   // (U0.xy, U90.xy)
    layout(location = 1) out vec4 oB;   // (UΓ.xy, 0, 1)
    void main() {
      vec2 P = mix(uDom.xy, uDom.zw, vUv);
      vec2 v0 = vec2(0.0), v90 = vec2(0.0), vG = vec2(0.0);
      vec4 A = texelFetch(uPanels, ivec2(0, 0), 0);
      float gA = texelFetch(uPanels, ivec2(0, 1), 0).x;
      const float K = 0.15915494309;       // 1/(2π)
      for (int j = 0; j < 512; j++) {
        if (j >= uN) break;
        vec4 B = texelFetch(uPanels, ivec2(j + 1, 0), 0);
        float gB = texelFetch(uPanels, ivec2(j + 1, 1), 0).x;
        vec2 d = B.xy - A.xy; float L = length(d); vec2 t = d / L; vec2 n = vec2(-t.y, t.x);
        vec2 r = P - A.xy; float x = dot(r, t), y = dot(r, n);
        float r1 = x * x + y * y, r2 = (x - L) * (x - L) + y * y;
        if (r1 > 1e-12 && r2 > 1e-12) {
          float dth = atan(y, x - L) - atan(y, x);
          float lnr = 0.5 * log(r1 / r2);
          float Iy1 = x * dth - y * lnr, Ix1 = x * lnr - L + y * dth;
          float ua = -K * (dth - Iy1 / L), va = K * (lnr - Ix1 / L), ub = -K * (Iy1 / L), vb = K * (Ix1 / L);
          vec2 wa = ua * t + va * n, wb = ub * t + vb * n;
          v0 += wa * A.z + wb * B.z; v90 += wa * A.w + wb * B.w; vG += wa * gA + wb * gB;
        }
        A = B; gA = gB;
      }
      oA = vec4(v0, v90); oB = vec4(vG, 0.0, 1.0);
    }`,
});

function bakeField() {
  if (!HALF_RT) return;
  const pn = aircraft.panel, foil = aircraft.foil, N1 = pn.N + 1;
  const data = new Float32Array(N1 * 2 * 4);
  for (let j = 0; j < N1; j++) {
    data.set([foil.x[j], foil.y[j], pn.g0[j], pn.g90[j]], j * 4);
    data[(N1 + j) * 4] = pn.gG[j];
  }
  if (FIELD.panelTex) FIELD.panelTex.dispose();
  FIELD.panelTex = new THREE.DataTexture(data, N1, 2, THREE.RGBAFormat, THREE.FloatType);
  FIELD.panelTex.needsUpdate = true;
  bakeMat.uniforms.uPanels.value = FIELD.panelTex;
  bakeMat.uniforms.uN.value = pn.N;
  for (const lv of [FIELD.near, FIELD.far]) {
    if (!lv.rt) {

// 粒子シェーダ共通部：翼型の形・焼き込んだ速度場の読み出し・はく離域の乱れ
const GLSL_FIELD = /* glsl */ `
uniform sampler2D uNearA, uNearB, uFarA, uFarB;
uniform vec4 uNearDom, uFarDom;
uniform vec3 uNaca;       // (m, p, t)
uniform float uTime;
float nacaYt(float x) { x = clamp(x, 0.0, 1.0); float t = uNaca.z;
  return 5.0 * t * (0.2969 * sqrt(x) - 0.1260 * x - 0.3516 * x * x + 0.2843 * x * x * x - 0.1036 * x * x * x * x); }
float nacaYc(float x) { float m = uNaca.x, p = uNaca.y; if (m <= 0.0 || p <= 0.0) return 0.0; x = clamp(x, 0.0, 1.0);
  return x < p ? m / (p * p) * (2.0 * p * x - x * x) : m / ((1.0 - p) * (1.0 - p)) * ((1.0 - 2.0 * p) + 2.0 * p * x - x * x); }
bool insideFoil(vec2 q) { if (q.x <= 0.002 || q.x >= 0.998) return false; return abs(q.y - nacaYc(q.x)) < nacaYt(q.x); }
// 断面まわりの誘導速度（V∞=1 で無次元）。ca=cosα, sa=sinα, dG=循環の補正
vec2 secPert(vec2 q, float ca, float sa, float dG) {
  vec2 uvF = (q - uFarDom.xy) / (uFarDom.zw - uFarDom.xy);
  vec2 ef = min(uvF, 1.0 - uvF);
  float wf = smoothstep(0.0, 0.12, min(ef.x, ef.y));
  if (wf <= 0.0) return vec2(0.0);
  vec4 a = textureLod(uFarA, uvF, 0.0); vec2 g = textureLod(uFarB, uvF, 0.0).xy;
  vec2 v = ca * a.xy + sa * a.zw + dG * g;
  vec2 uvN = (q - uNearDom.xy) / (uNearDom.zw - uNearDom.xy);
  vec2 en = min(uvN, 1.0 - uvN);
  float wn = smoothstep(0.0, 0.05, min(en.x, en.y));
  if (wn > 0.0) {
    vec4 an = textureLod(uNearA, uvN, 0.0); vec2 gn = textureLod(uNearB, uvN, 0.0).xy;
    v = mix(v, ca * an.xy + sa * an.zw + dG * gn, wn);
  }
  return v * wf;
}
// 失速時：はく離点 f より後ろ、翼面近くの流れを遅く・乱れたものにする（模式表示）
//   後縁より後ろでは、後縁から一様流の方向（傾き ta = tanα）へ伸びる後流帯とする
vec2 sepMod(vec2 q, vec2 v, float f, float side, float ta) {
  float s = 1.0 - f;
  if (s < 0.03 || q.x < f - 0.03 || q.x > 1.0 + 2.5 * s) return v;
  float ys = q.x < 1.0 ? nacaYc(q.x) + side * nacaYt(q.x) : (q.x - 1.0) * ta;
  float d = (q.y - ys) * side;

 * ------------------------------------------------------------------- */
const CAMS = {
  hero: { pos: [-13, 6, 15], tgt: [0.5, -0.3, 0] },
  rear: { pos: [24, 4, 15], tgt: [7, -0.8, 0] },
  side: { pos: [0, 1.5, 27], tgt: [0, -0.2, 0] },
  chase: { pos: [11, 4.5, 21], tgt: [-1, -0.2, 0] },
};
const tween = { t: 1 };
function flyTo(name, dur = 1.6) {
  const c = CAMS[name], k = Math.max(1, aircraft.wing.b / 11);
  tween.cam = cam3D; tween.ctl = ctl3D; tween.t = 0; tween.dur = dur;
  tween.p0 = cam3D.position.clone(); tween.t0 = ctl3D.target.clone();
  tween.p1 = new THREE.Vector3(...c.pos).multiplyScalar(k); tween.t1 = new THREE.Vector3(...c.tgt).multiplyScalar(k);
}
function flySec(dur = 1.2) {
  tween.cam = camSec; tween.ctl = ctlSec; tween.t = 0; tween.dur = dur;
  tween.p0 = camSec.position.clone(); tween.t0 = ctlSec.target.clone(); tween.z0 = camSec.zoom;
  tween.p1 = new THREE.Vector3(0.6, 0.05, 5); tween.t1 = new THREE.Vector3(0.6, 0.05, 0); tween.z1 = 1;
}
function updateTween(dt) {
  if (tween.t >= 1) return;
  tween.t = Math.min(1, tween.t + dt / tween.dur);
  const e = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
  tween.cam.position.lerpVectors(tween.p0, tween.p1, e);
  tween.ctl.target.lerpVectors(tween.t0, tween.t1, e);

/* ---------------------------------------------------------------------
 * 18. セルフテスト（物理）＋ GPU 速度場と CPU パネル法の一致確認
 * ------------------------------------------------------------------- */
function gpuFieldTest() {
  if (!FLOAT_RT || !FIELD.near.rt) return { name: 'GPU 速度場 = CPU パネル法（誘導速度）', ok: true, detail: 'スキップ（float レンダーターゲット非対応）' };
  const pts = [[-0.12, 0.18], [0.3, 0.16], [0.62, -0.1], [0.85, 0.09], [1.25, -0.05], [0.05, -0.08]];
  const rt = new THREE.WebGLRenderTarget(pts.length, 1, { type: THREE.FloatType, depthBuffer: false });
  const U = fieldUniforms();
  U.uNaca.value.set(aircraft.foil.m, aircraft.foil.p, aircraft.foil.t);
  U.uPts = { value: pts.map(([x, y]) => new THREE.Vector2(x, y)) };
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: U, vertexShader: QUAD_VS,
    fragmentShader: `precision highp float; precision highp sampler2D;\n${GLSL_FIELD}\nuniform vec2 uPts[${pts.length}];
      layout(location = 0) out vec4 o;
      void main(){ vec2 q = uPts[int(gl_FragCoord.x)]; o = vec4(secPert(q, 1.0, 0.0, 0.0), secPert(q, 0.0, 1.0, 0.0)); }`,
  });
  const sc = new THREE.Scene(); sc.add(new THREE.Mesh(quadGeo, mat));
  renderer.setRenderTarget(rt); renderer.render(sc, quadCam); renderer.setRenderTarget(null);
  const buf = new Float32Array(pts.length * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, pts.length, 1, buf);
  const pn = aircraft.panel, v = [0, 0];
  let err = 0;
  pts.forEach(([x, y], i) => {
    pn.velocityAt(x, y, pn.g0, 0, v); err = Math.max(err, Math.abs(v[0] - 1 - buf[i * 4]), Math.abs(v[1] - buf[i * 4 + 1]));
    pn.velocityAt(x, y, pn.g90, Math.PI / 2, v); err = Math.max(err, Math.abs(v[0] - Math.cos(Math.PI / 2) - buf[i * 4 + 2]), Math.abs(v[1] - 1 - buf[i * 4 + 3]));
  });
  rt.dispose(); mat.dispose();
  return { name: 'GPU 速度場 = CPU パネル法（誘導速度）', ok: err < 0.02, detail: `最大誤差 ${err.toExponential(2)}（V∞ 比）` };
}
function runTests() {
  let res;
  try { res = SelfTest.run(); } catch (e) { res = [{ name: 'SelfTest 実行', ok: false, detail: String(e) }]; }
  try { res.push(gpuFieldTest()); } catch (e) { res.push({ name: 'GPU 速度場テスト', ok: false, detail: String(e) }); }
  const nOk = res.filter((r) => r.ok).length;
  $('testTable').innerHTML = res.map((r) => `<tr><td class="s ${r.ok ? 'ok' : 'ng'}">${r.ok ? '✓' : '✗'}</td><td>${r.name}</td><td class="d num">${r.detail}</td></tr>`).join('');
  const b = $('btnTest');
  b.textContent = `セルフテスト ${nOk === res.length ? '✓' : '✗'} ${nOk}/${res.length}`;
  b.classList.add(nOk === res.length ? 'ok' : 'ng');
  console.groupCollapsed(`AeroLab セルフテスト: ${nOk}/${res.length} 合格`);
  console.table(res.map((r) => ({ 結果: r.ok ? '✓' : '✗', 項目: r.name, 詳細: r.detail })));
  console.groupEnd();
}

/* ---------------------------------------------------------------------
 * 19. 性能の自動調整（粒子数の段階を fps で上げ下げ）
 * ------------------------------------------------------------------- */
const PERF = { frames: 0, t: 0, fps: 60, good: 0, cap: TIERS.length - 1 };
function perfSample(dtRaw) {
  if (dtRaw > 0.25) return;                 // タブ切替などの長い停止は無視
  PERF.frames++; PERF.t += dtRaw;
  if (PERF.t < 1.5) return;
  PERF.fps = PERF.frames / PERF.t; PERF.frames = 0; PERF.t = 0;
  if (P.quality !== 'auto') return;
  if (PERF.fps < 36 && PARTS.tier > 0) { PERF.cap = PARTS.tier - 1; setTier(PARTS.tier - 1); PERF.good = 0; }
  else if (PERF.fps < 28 && PARTS.tier === 0 && renderer.getPixelRatio() > 1) renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.5));
  else if (PERF.fps > 56) { if (++PERF.good >= 3 && PARTS.tier < PERF.cap) { setTier(PARTS.tier + 1); PERF.good = 0; } }
  else PERF.good = 0;
}

/* ---------------------------------------------------------------------
 * 20. 毎フレームの処理
 * ------------------------------------------------------------------- */
function stepPhysics(dt) {
  if (P.mode === 'tunnel') { sim.setTunnel(P.alpha * DEG, P.V); return; }
  physAcc += dt;
  let n = 0;
  while (physAcc >= PHYS_DT && n < 48) { sim.step(PHYS_DT); physAcc -= PHYS_DT; n++; }
  if (n >= 48) physAcc = 0;
  while (sim.events.length) {
    const e = sim.events.shift();
    if (e === 'liftoff') toast('離陸！ 揚力 L が重量 W を上回りました');
    if (e === 'touchdown' && P.mode === 'glide') { toast(`接地（滑空距離 ${fmt(sim.s[0] / 1000, 2)} km）→ 再スタート`); setMode('glide'); }
  }
  if (P.mode === 'powered' && sim.s[1] > 2500) { toast('高度 2,500 m に到達 → リセット'); setMode('powered'); }
}

function updateForces() {
  forceGroup.visible = LAYERS.forces && P.view === '3d';
  if (!forceGroup.visible) return;
  const k = (0.34 * aircraft.wing.b) / S.W, g = S.gamma, th = S.theta, O = new THREE.Vector3(0, 0, 0);
  FA.L.set(O, new THREE.Vector3(Math.sin(g), Math.cos(g), 0), S.L * k);
  FA.D.set(O, new THREE.Vector3(Math.cos(g), -Math.sin(g), 0), S.D * k);
  FA.W.set(O, new THREE.Vector3(0, -1, 0), S.W * k);
  FA.T.set(O, new THREE.Vector3(-Math.cos(th), Math.sin(th), 0), S.T * k);
  const lb = [['L', '揚力 L', S.L], ['D', '抗力 D', S.D], ['W', '重力 W', S.W], ['T', '推力 T', S.T]];
  const o = O.clone().project(cam3D);
  for (const [key, name, F] of lb) {
    if (!FA[key].group.visible) continue;
    const t = FA[key].tip.clone().project(cam3D), dx = (t.x - o.x) * innerWidth, dy = (t.y - o.y) * innerHeight;
    const anc = Math.abs(dy) > Math.abs(dx) ? (dy > 0 ? 'top' : 'bottom') : dx > 0 ? 'right' : 'left';
    label('f' + key, FA[key].tip, cam3D, `${name} ${fmtKN(F)}`, key, anc);
  }
}

function updateEnv() {
  const flight = P.mode !== 'tunnel';
  envGroup.visible = flight && LAYERS.env;
  if (!envGroup.visible) return;
  const z = sim.s[1], th = S.theta, xAc = sim.s[0];
  const gY = -z - (z < 0.5 ? 0.3 * Math.sin(th) + GEAR_H * Math.cos(th) : GEAR_H);
  ground.position.y = gY;
  runway.position.set(xAc - 720, gY + 0.02, 0);
  groundMat.uniforms.uXac.value = xAc % 2000;
  for (const c of clouds) {
    const X = (((xAc - c.x) % 8000) + 12000) % 8000 - 4000;
    c.sp.position.set(X, c.h - z + gY + z, c.z);
  }
}

let lastT = performance.now(), hudTimer = 0, infoTimer = 0, tourTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtRaw = (now - lastT) / 1000; lastT = now;
  const dtR = Math.min(dtRaw, 0.1);
  let dtS = P.paused ? 0 : dtR * P.timeScale;
  if (stepOnce > 0) { dtS = stepOnce; stepOnce = 0; }

  // --- 物理（固定刻み 120 Hz, RK4） ---
  stepPhysics(dtS);
  S = sim.evaluate(sim.s, S);

  // --- 物理結果 → 描画 ---
  acGroup.rotation.z = -S.theta;
  updateAeroVisuals();
  updateSection();
  updateForces();
  updateEnv();
  const T = S.T;
  propGroup.rotation.x += dtS * (P.mode === 'glide' ? 5 : 20 + T / 60);
  propDisc.material.opacity = clamp(T / 6000, 0, 0.3);

  const view3 = P.view === '3d';
  wakeGroup.visible = view3;
  vortexGroup.visible = LAYERS.vortex; dwGroup.visible = LAYERS.downwash; gammaGroup.visible = LAYERS.gamma;
  vortexTimer -= dtR;
  if (view3 && LAYERS.vortex && vortexDirty && vortexTimer <= 0) { rebuildVortexLines(); vortexDirty = false; vortexTimer = 0.25; }

  // --- GPU 粒子 ---
  const nacaV = [aircraft.foil.m, aircraft.foil.p, aircraft.foil.t];
  if (view3) {
    const ps = LAYERS.particles ? getParticles('3d') : null;
    if (PARTS.p3) PARTS.p3.mesh.visible = !!ps;
    if (ps) {
      const w = aircraft.wing, b = w.b, u = ps.u, a = S.alpha;
      u.uDir.value.set(Math.cos(a), Math.sin(a));
      u.uHalfSpan.value = b / 2; u.uCroot.value = w.cRoot; u.uNaca.value.set(...nacaV);
      u.uDomMin.value.set(-(0.6 * w.cRoot + 2.5), -0.32 * b, -0.75 * b);
      u.uDomMax.value.set(1.7 * b, 0.32 * b, 0.75 * b);
      u.uU.value = U3D_PER_B * b; u.uMaxAge.value = 60;

      ps.compute(dtS);
      const r = ps.renderMat.uniforms;
      r.uU.value = U3D_PER_B * b; r.uTrail.value = 0.14; r.uWidth.value = 0.017 * Math.max(1, b / 11); r.uAlpha.value = 0.75; r.uFaint.value = 0.1;
      r.uColorMode.value = P.colorMode === 'cp' ? 0 : 1;
    }
  } else {
    const ps = LAYERS.particles ? getParticles('2d') : null;
    if (PARTS.p2) PARTS.p2.mesh.visible = !!ps;
    if (ps) {
      const u = ps.u, a = secState.a;
      u.uDir.value.set(Math.cos(a), Math.sin(a)); u.uCa.value = Math.cos(a); u.uSa.value = Math.sin(a);
      u.uDG.value = secState.dG; u.uF.value = secState.f; u.uSide.value = a >= 0 ? 1 : -1;
      u.uNaca.value.set(...nacaV);
      u.uDomMin.value.set(-1.35, -1.0, -1); u.uDomMax.value.set(3.1, 1.0, 1);
      u.uU.value = U2D; u.uMaxAge.value = 25;
      ps.compute(dtS);
      const r = ps.renderMat.uniforms;
      r.uU.value = U2D; r.uTrail.value = 0.32; r.uWidth.value = 0.0026; r.uAlpha.value = 0.85; r.uFaint.value = 0.32;
      r.uColorMode.value = P.colorMode === 'cp' ? 0 : 1;
    }
    smokeGroup.visible = LAYERS.smoke;
    if (LAYERS.smoke) { smoke.step(dtS); smoke.draw(); }
    if (SEC.arrows) SEC.arrows.visible = LAYERS.pArrows;
    if (SEC.ribbon) SEC.ribbon.visible = LAYERS.cp;
    // 断面の揚力・抗力（風軸：風は水平）と一様流の矢印
    const kL = 0.28;
    SA.L.set(0.25, 0, 0, secState.cl >= 0 ? 1 : -1, Math.abs(secState.cl) * kL);
    SA.D.set(0.25, 0, 1, 0, secState.cd * kL * 10);
    const vx = ctlSec.target.x + camSec.left / camSec.zoom + 0.06, vy = ctlSec.target.y + camSec.top / camSec.zoom - (innerWidth > 900 ? 0.42 : 0.62) / camSec.zoom;
    SA.V.set(vx, vy, 1, 0, 0.28 / camSec.zoom);
    label('sL', SA.L.tip, camSec, `揚力 Cl = ${fmt(secState.cl, 2)}`, 'L');
    label('sD', SA.D.tip, camSec, `抗力 Cd = ${fmt(secState.cd, 3)}（×10 表示）`, 'D', 'right');
    label('sV', SA.V.tip, camSec, 'V∞（風）', 'plain', 'right');
    label('sA', new THREE.Vector3(-0.08, -0.05, 0), camSec, `α = ${fmt(secState.a / DEG, 1)}°`, 'plain');
    if (SEC.stag) label('sS', SEC.stag.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(-0.02, -0.05, 0)), camSec, 'よどみ点', 'dim');
    if (LAYERS.smoke) label('sTE', new THREE.Vector3(1, 0.2, 0).applyMatrix4(secFoil.matrixWorld), camSec, '後縁', 'dim');
  }

  // --- HUD・グラフ・情報（間引いて更新） ---
  hudTimer -= dtR; infoTimer -= dtR; chartTimer -= dtR; tourTimer -= dtR;
  if (hudTimer <= 0) { updateHUD(); hudTimer = 0.1; }
  if (infoTimer <= 0) { const h = infoHTML(); if ($('info')._h !== h) { $('info').innerHTML = h; $('info')._h = h; } infoTimer = 0.2; }
  if (chartTimer <= 0 && LAYERS.charts && !$('charts').classList.contains('collapsed')) { updateCharts(); chartTimer = 0.2; }
  if (TOUR.active && tourTimer <= 0) { $('tourBody').innerHTML = STEPS[TOUR.i].body(); tourTimer = 0.5; }
  const slow = P.view === '3d' ? S.V / (U3D_PER_B * aircraft.wing.b) : S.V / (U2D * aircraft.wing.mac);
  $('perf').textContent = `${(TIERS[PARTS.tier][0] * TIERS[PARTS.tier][1]).toLocaleString()} 粒子 · ${PERF.fps.toFixed(0)} fps`
    + (S.V > 1 ? ` · 流れの表示は実際の約 1/${fmt(slow * (1 / Math.max(P.timeScale, 1e-3)), 0)} の速さ` : '');

  // --- カメラと描画 ---
  updateTween(dtR);
  if (view3) {
    ctl3D.update(); sky.position.copy(cam3D.position);
    renderer.render(scene3D, cam3D);
  } else {
    ctlSec.update();
    renderer.render(sceneSec, camSec);
  }
  flushLabels();
  perfSample(dtRaw);
}

/** 縦長の画面では視野角を広げ、翼幅が画面に収まるようにする */

  cam3D.aspect = a; cam3D.fov = a < 0.8 ? 64 : a < 1.2 ? 54 : 45; cam3D.updateProjectionMatrix();
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fit3DCamera();
  fitSecCamera(); layoutVars();
});
